{% extends "base.html" %}

{% block title %}Log In | LimahCode WebAdventure{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 40px auto;">
    <div class="card" style="padding: 35px; border-radius: var(--radius-lg); background: white; box-shadow: var(--card-shadow); border: var(--border-width) solid var(--border-color);">
        <div style="text-align: center; margin-bottom: 25px;">
            <div style="font-size: 50px; margin-bottom: 10px;">🔑</div>
            <h1 style="font-size: 28px; color: var(--color-purple); margin-bottom: 8px;">Welcome Back!</h1>
            <p style="color: var(--text-secondary); font-size: 15px;">Log in to access your WebAdventure dashboard.</p>
        </div>

        <!-- Form submits and redirects to mini dashboard -->
        <form action="/mini-dashboard" method="GET">
            <div style="margin-bottom: 18px;">
                <label for="login-email" style="display: block; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);">Email Address:</label>
                <input type="email" id="login-email" name="email" placeholder="student@example.com" required style="width: 100%; padding: 12px 16px; border: var(--border-width) solid var(--border-color); border-radius: var(--radius-md); font-size: 15px; font-family: inherit; outline: none;">
            </div>

            <div style="margin-bottom: 24px;">
                <label for="login-password" style="display: block; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);">Password:</label>
                <input type="password" id="login-password" name="password" placeholder="••••••••" required style="width: 100%; padding: 12px 16px; border: var(--border-width) solid var(--border-color); border-radius: var(--radius-md); font-size: 15px; font-family: inherit; outline: none;">
            </div>

            <button type="submit" class="btn btn-warning" style="width: 100%; padding: 14px; font-size: 18px; text-align: center; justify-content: center; display: flex; align-items: center; gap: 8px;">
                Log In <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-secondary);">
            Don't have an account yet? <a href="/signup" style="color: var(--color-primary); font-weight: 700; text-decoration: underline;">Sign Up here</a>
        </div>
    </div>
</div>
{% endblock %}
