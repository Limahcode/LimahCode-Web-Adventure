{% extends "base.html" %}

{% block title %}Sign Up | LimahCode WebAdventure{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 40px auto;">
    <div class="card" style="padding: 35px; border-radius: var(--radius-lg); background: white; box-shadow: var(--card-shadow); border: var(--border-width) solid var(--border-color);">
        <div style="text-align: center; margin-bottom: 25px;">
            <div style="font-size: 50px; margin-bottom: 10px;">🚀</div>
            <h1 style="font-size: 28px; color: var(--color-primary); margin-bottom: 8px;">Create Your Account</h1>
            <p style="color: var(--text-secondary); font-size: 15px;">Join LimahCode WebAdventure and start coding!</p>
        </div>

        <!-- Form submits and redirects to login page -->
        <form action="/login" method="GET">
            <div style="margin-bottom: 18px;">
                <label for="fullname" style="display: block; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);">Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="e.g. Alex Johnson" required style="width: 100%; padding: 12px 16px; border: var(--border-width) solid var(--border-color); border-radius: var(--radius-md); font-size: 15px; font-family: inherit; outline: none;">
            </div>

            <div style="margin-bottom: 18px;">
                <label for="email" style="display: block; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="student@example.com" required style="width: 100%; padding: 12px 16px; border: var(--border-width) solid var(--border-color); border-radius: var(--radius-md); font-size: 15px; font-family: inherit; outline: none;">
            </div>

            <div style="margin-bottom: 24px;">
                <label for="password" style="display: block; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);">Create Password:</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required style="width: 100%; padding: 12px 16px; border: var(--border-width) solid var(--border-color); border-radius: var(--radius-md); font-size: 15px; font-family: inherit; outline: none;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 18px; text-align: center; justify-content: center; display: flex; align-items: center; gap: 8px;">
                Sign Up Now <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-secondary);">
            Already have an account? <a href="/login" style="color: var(--color-secondary); font-weight: 700; text-decoration: underline;">Log In here</a>
        </div>
    </div>
</div>
{% endblock %}
